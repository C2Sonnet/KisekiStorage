[package]
name = "kiseki-storage"
version = "1.2.0"
edition = "2021"
authors = ["C2Sonnet"]
description = "Kiseki Storage - Windows storage dashboard / キセキの倉庫"
license = "CC-BY-NC-ND-4.0"
publish = false
build = "build.rs"

[dependencies]
eframe = "0.32.3"
image = { version = "0.25.8", default-features = false, features = ["png", "ico"] }
sysinfo = "0.36.1"
winreg = "0.55.0"
webbrowser = "1.0.4"

[build-dependencies]
embed-resource = "3.0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
